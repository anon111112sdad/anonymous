<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#101b20">
  <meta name="description" content="Anonymous video comparisons: VDOT, before and after training, and 30-second continuation ablations.">
  <meta property="og:title" content="Anonymous Video Demonstrations">
  <meta property="og:description" content="Side-by-side video comparisons and short and long video demonstrations.">
  <meta property="og:type" content="website">
  <meta name="robots" content="noindex, nofollow">
  <title>Anonymous Video Demonstrations</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="anonymous.css">
  <script src="anonymous-media.js" defer></script>
  <script src="anonymous-dmd250-media.js" defer></script>
  <script src="anonymous-comparison-media.js?v=20261118-selection" defer></script>
  <script src="anonymous-comparisons.js?v=20261118-selection" defer></script>
  <script src="anonymous.js" defer></script>
</head>
<body class="anonymous-page">
  <header class="anonymous-header"><div class="anonymous-container"><span>Anonymous submission</span><span>Video demonstrations</span></div></header>
  <main class="anonymous-container">
    <section class="anonymous-intro" aria-labelledby="anonymous-title">
      <p class="eyebrow">Supplementary videos</p>
      <h1 id="anonymous-title">Video demonstrations</h1>
      <p>Side-by-side comparisons, followed by DMD250 results across 5s, 14s, and 60s sequences.</p>
    </section>
    <section class="anonymous-comparisons" id="comparisons" aria-labelledby="comparisons-title">
      <div class="comparison-heading"><h2 id="comparisons-title">Video comparisons</h2><a href="#demonstrations">Browse all demonstrations <span aria-hidden="true">&darr;</span></a></div>
      <div class="comparison-filters" role="group" aria-label="Choose a video comparison">
        <button class="comparison-filter active" data-comparison="vdot" aria-pressed="true" aria-controls="comparison-grid">VDOT comparison <span>5s / 30s</span></button>
        <button class="comparison-filter" data-comparison="training" aria-pressed="false" aria-controls="comparison-grid">Before / after training <span>14s</span></button>
        <button class="comparison-filter" data-comparison="continuation" aria-pressed="false" aria-controls="comparison-grid">Continuation ablation <span>30s</span></button>
      </div>
      <p class="comparison-description" id="comparison-description" aria-live="polite"></p>
      <div class="comparison-grid" id="comparison-grid" aria-label="Side-by-side video comparisons"></div>
      <noscript><p>Enable JavaScript to browse the comparison videos.</p></noscript>
    </section>
    <h2 class="demonstrations-title" id="demonstrations">Video demonstrations</h2>
    <div class="anonymous-toolbar"><div class="anonymous-filters" role="group" aria-label="Filter videos">
      <button class="anonymous-filter active" data-filter="all" aria-pressed="true">All videos</button>
      <button class="anonymous-filter" data-filter="5s" aria-pressed="false">5s</button>
      <button class="anonymous-filter" data-filter="14s" aria-pressed="false">14s</button>
      <button class="anonymous-filter" data-filter="60s" aria-pressed="false">60s</button>
      <button class="anonymous-filter" data-filter="scenes" aria-pressed="false">Scenes</button>
      <button class="anonymous-filter" data-filter="control" aria-pressed="false">Control</button>
    </div><span id="anonymous-count" aria-live="polite"></span></div>
    <section class="anonymous-grid" id="anonymous-grid" aria-label="Video demonstrations"></section>
  </main>
  <footer class="anonymous-footer"><div class="anonymous-container">Anonymous submission</div></footer>
</body>
</html>
