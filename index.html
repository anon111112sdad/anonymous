<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#101b20">
  <meta name="description" content="Anonymous DMD250 video results at 5, 14, and 60 seconds.">
  <meta property="og:title" content="Anonymous Video Demonstrations">
  <meta property="og:description" content="DMD250 results across short and long video sequences.">
  <meta property="og:type" content="website">
  <meta name="robots" content="noindex, nofollow">
  <title>Anonymous Video Demonstrations</title>
  <link rel="stylesheet" href="anonymous.css">
  <script src="anonymous-media.js" defer></script>
  <script src="anonymous-dmd250-media.js" defer></script>
  <script src="anonymous.js" defer></script>
</head>
<body class="anonymous-page">
  <header class="anonymous-header"><div class="anonymous-container"><span>Anonymous submission</span><span>Video demonstrations</span></div></header>
  <main class="anonymous-container">
    <section class="anonymous-intro" aria-labelledby="anonymous-title">
      <p class="eyebrow">Supplementary videos</p>
      <h1 id="anonymous-title">Video demonstrations</h1>
      <p>DMD250 results across 5s, 14s, and 60s sequences.</p>
    </section>
    <div class="anonymous-toolbar"><div class="anonymous-filters" role="group" aria-label="Filter videos">
      <button class="anonymous-filter active" data-filter="all" aria-pressed="true">All videos</button>
      <button class="anonymous-filter" data-filter="5s" aria-pressed="false">5s</button>
      <button class="anonymous-filter" data-filter="14s" aria-pressed="false">14s</button>
      <button class="anonymous-filter" data-filter="60s" aria-pressed="false">60s</button>
      <button class="anonymous-filter" data-filter="scenes" aria-pressed="false">Scenes</button>
      <button class="anonymous-filter" data-filter="control" aria-pressed="false">Control</button>
      <button class="anonymous-filter" data-filter="extended" aria-pressed="false">Extended</button>
    </div><span id="anonymous-count" aria-live="polite"></span></div>
    <section class="anonymous-grid" id="anonymous-grid" aria-label="Video demonstrations"></section>
  </main>
  <footer class="anonymous-footer"><div class="anonymous-container">Anonymous submission</div></footer>
</body>
</html>
